# Publishes web/ (JSSpeccy + the tape of the latest release) to GitHub Pages
name: Pages
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['web/**', 'img/zxplc_load.png', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Tape of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" -p zxplc.tap -D web
          cp img/zxplc_load.png web/loading.png
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
